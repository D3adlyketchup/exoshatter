<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exoshatter</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    color: #222;
  }
  header {
    background: #fff;
    border-bottom: 1px solid #ddd;
    padding: 14px 20px;
  }
  header a {
    color: #222;
    text-decoration: none;
    font-weight: bold;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header img {
    height: 28px;
    display: block;
  }
  main {
    max-width: 480px;
    margin: 40px auto;
    padding: 0 20px 60px;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 4px;
  }
  p.intro {
    color: #555;
    margin-top: 0;
    margin-bottom: 24px;
  }
  .box {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 20px;
  }
  .box a {
    display: block;
    padding: 12px 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
    color: #222;
    text-decoration: none;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .box a:last-child { margin-bottom: 0; }
  .box a:hover { border-color: #2563eb; color: #2563eb; }
  footer {
    text-align: center;
    color: #999;
    font-size: 12px;
    padding: 20px;
  }
</style>
</head>
<body>

<header>
  <a href="/"><img src="/img/exologo.png" alt="Exoshatter logo"> exoshatter.com</a>
</header>

<main>
  <h1>Exoshatter</h1>
  <p class="intro">A few small tools.</p>

  <div class="box">
    <a href="/qr/">Free QR code maker</a>
    <a href="/studyflow/">Studyflow</a>
  </div>
</main>

<footer>exoshatter.com</footer>

</body>
</html>
