<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    color: #222;
  }
  header {
    background: #fff;
    border-bottom: 1px solid #ddd;
    padding: 14px 20px;
  }
  header a {
    color: #222;
    text-decoration: none;
    font-weight: bold;
    font-size: 16px;
  }
  header img {
    height: 80px;
    display: block;
  }
  main {
    max-width: 480px;
    margin: 40px auto;
    padding: 0 20px 60px;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 4px;
  }
  p.intro {
    color: #555;
    margin-top: 0;
    margin-bottom: 24px;
  }
  .box {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 20px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 6px;
  }
  textarea {
    width: 100%;
    min-height: 90px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
  }
  .colors {
    display: flex;
    gap: 20px;
    margin-top: 16px;
  }
  .colors div {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  input[type=color] {
    width: 44px;
    height: 30px;
    padding: 0;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .actions {
    margin-top: 20px;
    display: flex;
    gap: 10px;
  }
  button {
    font-size: 14px;
    padding: 10px 16px;
    border-radius: 4px;
    border: 1px solid #ccc;
    background: #f0f0f0;
    cursor: pointer;
  }
  button.primary {
    background: #2563eb;
    color: #fff;
    border-color: #2563eb;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .hint {
    font-size: 13px;
    color: #888;
    margin-top: 8px;
  }
  .hint.warn {
    color: #c0392b;
  }
  .result {
    margin-top: 28px;
    text-align: center;
  }
  #qr-canvas {
    display: inline-block;
    background: #fff;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
  }
  footer {
    text-align: center;
    color: #999;
    font-size: 12px;
    padding: 20px;
  }
</style>
</head>
<body>

<header>
  <a href="/"><img src="/img/exologo.png" alt="Exoshatter logo"> exoshatter.com</a>
</header>


<main>
  <h1>QR Code Generator</h1>
  <p class="intro">Enter a link or text and turn it into a QR code. Everything happens locally in your browser, nothing is stored.</p>

  <div class="box">
    <label for="input-text">Link or text</label>
    <textarea id="input-text" placeholder="https://exoshatter.com"></textarea>

    <div class="colors">
      <div>
        <label for="color-dark">QR color</label>
        <input type="color" id="color-dark" value="#000000">
      </div>
      <div>
        <label for="color-light">Background</label>
        <input type="color" id="color-light" value="#ffffff">
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="btn-generate">Generate QR code</button>
      <button id="btn-download" disabled>Download</button>
    </div>
    <p class="hint" id="status-hint"></p>

    <div class="result" id="result" style="display:none;">
      <div id="qr-canvas"></div>
    </div>
  </div>
</main>

<footer>free QR generator — exoshatter.com</footer>

<script>
(function(){
  const inputText = document.getElementById('input-text');
  const colorDark = document.getElementById('color-dark');
  const colorLight = document.getElementById('color-light');
  const btnGenerate = document.getElementById('btn-generate');
  const btnDownload = document.getElementById('btn-download');
  const qrContainer = document.getElementById('qr-canvas');
  const result = document.getElementById('result');
  const statusHint = document.getElementById('status-hint');

  btnGenerate.addEventListener('click', generate);

  function generate(){
    const payload = inputText.value.trim();
    if(!payload){
      statusHint.textContent = 'Enter a link or text first.';
      statusHint.classList.add('warn');
      return;
    }
    statusHint.textContent = '';
    statusHint.classList.remove('warn');
    qrContainer.innerHTML = '';

    new QRCode(qrContainer, {
      text: payload,
      width: 240,
      height: 240,
      colorDark: colorDark.value,
      colorLight: colorLight.value,
      correctLevel: QRCode.CorrectLevel.M
    });

    result.style.display = 'block';
    btnDownload.disabled = false;
  }

  btnDownload.addEventListener('click', () => {
    const canvas = qrContainer.querySelector('canvas');
    if(!canvas) return;
    const link = document.createElement('a');
    link.download = 'qr-code.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  inputText.addEventListener('keydown', e => {
    if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)) generate();
  });
})();
</script>

</body>
</html>
